<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agent / state animations</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Dark-board palette in the spirit of maths-explainer videos: near-black navy, chalk white, one blue, one yellow. */
:root{
  --bg:#0b0f1a; --chalk:#ececf1; --dim:#8a93a6; --blue:#58c4dd; --yellow:#ffd54a; --green:#83c167; --red:#fc6255; --panel:#121a2b; --rule:#26324a;
  --sans:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); color-scheme:dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark; } }
:root[data-theme="dark"]{ color-scheme:dark; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; min-height:100%; background:var(--bg); color:var(--chalk); font-family:var(--sans); }
body.transparent{ background:transparent; }
.frame{ width:100%; aspect-ratio:16/9; position:relative; }
.frame svg{ position:absolute; inset:0; width:100%; height:100%; }
.gallery{ padding:1.5rem; display:grid; gap:1.5rem; grid-template-columns:repeat(auto-fill,minmax(420px,1fr)); }
.gallery h1{ grid-column:1/-1; font-weight:500; font-size:1.2rem; margin:0 0 .25rem; }
.gallery p{ grid-column:1/-1; color:var(--dim); margin:0 0 1rem; font-size:.95rem; max-width:70ch; }
.card{ background:var(--panel); border-radius:12px; overflow:hidden; border:1px solid var(--rule); }
.card .frame{ background:var(--bg); }
.card footer{ padding:.6rem .9rem; display:flex; justify-content:space-between; align-items:center; font-size:.85rem; color:var(--dim); }
.card a{ color:var(--blue); text-decoration:none; font-family:var(--mono); font-size:.8rem; }
.single{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
.single .frame{ width:min(100vw,calc(100vh*16/9)); }

.t{ font-family:var(--sans); fill:var(--chalk); }
.m{ font-family:var(--mono); fill:var(--chalk); }
.dim{ fill:var(--dim); } .bl{ fill:var(--blue); } .ye{ fill:var(--yellow); } .gn{ fill:var(--green); } .rd{ fill:var(--red); }
.bx{ fill:var(--bg); stroke:var(--chalk); stroke-width:1.6; }
.bx.bl{ fill:var(--bg); stroke:var(--blue); } .bx.ye{ fill:var(--bg); stroke:var(--yellow); } .bx.dim{ stroke:var(--dim); stroke-dasharray:4 4; } .bx.rd{ fill:var(--bg); stroke:var(--red); }
.ln{ stroke:var(--chalk); stroke-width:1.6; fill:none; }
.ln.bl{ stroke:var(--blue); stroke-width:2.2; } .ln.ye{ stroke:var(--yellow); stroke-width:2.2; } .ln.dim{ stroke:var(--dim); stroke-width:1.2; }
.dot{ fill:var(--yellow); }

.write{ stroke-dasharray:1400; stroke-dashoffset:1400; animation:write 1.1s ease-out forwards; animation-delay:var(--d,0s); }
.pop{ transform-box:fill-box; transform-origin:center; animation:pop .5s cubic-bezier(.2,.8,.2,1) both; animation-delay:var(--d,0s); }
.rise{ animation:rise .55s ease-out both; animation-delay:var(--d,0s); }
.fade{ animation:fade 1s ease both; animation-delay:var(--d,0s); }
.pulse{ transform-box:fill-box; transform-origin:center; animation:pulse 1.6s ease-in-out infinite; animation-delay:var(--d,0s); }
.travel{ offset-rotate:0deg; animation:travel var(--t,1.8s) linear infinite; animation-delay:var(--d,0s); }
.shake{ transform-box:fill-box; transform-origin:center; animation:shake .45s ease-in-out 3; animation-delay:var(--d,0s); }
.flash{ animation:flash 1.2s ease-in-out infinite; animation-delay:var(--d,0s); }
@keyframes write{ to{ stroke-dashoffset:0; } }
@keyframes pop{ from{ opacity:0; transform:scale(.8);} to{ opacity:1; transform:scale(1);} }
@keyframes rise{ from{ opacity:0; transform:translateY(12px);} to{ opacity:1; transform:translateY(0);} }
@keyframes fade{ to{ opacity:.15; } }
@keyframes pulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.08);} }
@keyframes travel{ from{ offset-distance:0%;} to{ offset-distance:100%;} }
@keyframes shake{ 0%,100%{ transform:translateX(0);} 25%{ transform:translateX(-5px);} 75%{ transform:translateX(5px);} }
@keyframes flash{ 0%,100%{ opacity:1;} 50%{ opacity:.25;} }
@media (prefers-reduced-motion: reduce){ .write,.pop,.rise,.fade,.pulse,.travel,.shake,.flash{ animation:none; opacity:1; stroke-dashoffset:0; } }
</style>
</head>
<body>
<div id="root"></div>
<script>
const W=960,H=540;
const box=(x,y,w,h,label,o={})=>`<g class="${o.anim||'pop'}" style="--d:${o.d||0}s"><rect class="bx ${o.c||''}" x="${x}" y="${y}" width="${w}" height="${h}" rx="6"/>${label?`<text class="${o.mono?'m':'t'} ${o.tc||''}" x="${x+w/2}" y="${y+h/2+6}" font-size="${o.fs||18}" ${o.bold?'font-weight="600"':''} text-anchor="middle">${label}</text>`:''}</g>`;
const arrow=(x1,y1,x2,y2,o={})=>`<path class="ln ${o.c||''} ${o.anim||'write'}" style="--d:${o.d||0}s" d="M${x1},${y1} ${o.via?`L${o.via}`:''} L${x2},${y2}" marker-end="url(#ah-${o.c||'w'})"/>`;
const txt=(x,y,s,o={})=>`<text class="${o.mono?'m':'t'} ${o.tc||''} ${o.anim||'rise'}" style="--d:${o.d||0}s" x="${x}" y="${y}" font-size="${o.fs||18}" ${o.bold?'font-weight="600"':''} ${o.italic?'font-style="italic"':''} text-anchor="${o.anchor||'start'}">${s}</text>`;
const lines=(x,y,arr,o={})=>arr.map((s,i)=>txt(x,y+i*(o.lh||26),s,{...o,d:(o.d||0)+i*(o.step||.12)})).join('');
const mk=(id,c)=>`<marker id="ah-${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${c}"/></marker>`;
const defs=`<defs>${mk('w','var(--chalk)')}${mk('bl','var(--blue)')}${mk('ye','var(--yellow)')}${mk('dim','var(--dim)')}</defs>`;
const svg=inner=>`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">${defs}${inner}</svg>`;

const scenes={
 loop:{ cycle:7, title:'The control-plane loop', v:()=>{ const n=['Prompt','AI agent','MCP server','Edge Impulse API','Training job','Result']; let s=''; n.forEach((t,i)=>{ const x=40+i*150; s+=box(x,230,135,70,t,{d:.2+i*.4,c:i===2?'bl':'',fs:16,bold:i===2}); if(i<5) s+=arrow(x+135,265,x+150,265,{c:'bl',d:.4+i*.4}); }); s+=arrow(857,300,257,300,{via:'857,350 257,350',c:'dim',d:3,anim:'write'})+txt(557,380,'iterate',{tc:'dim',italic:true,anchor:'middle',d:3.6,fs:15}); s+=txt(480,120,'A natural-language control plane',{fs:30,anchor:'middle',d:4,bold:true}); return svg(s); }},
 leak:{ cycle:8, title:'Then it started leaking state', v:()=>{ const items=[['block IDs',460,60],['project / org IDs',700,60],['job status',460,160],['retries',700,160],['previous config',460,260],['new result',700,260],['approval',460,360],['orphaned job',700,360]]; let s=box(40,210,150,70,'Agent',{c:'bl',bold:true,d:.1})+arrow(190,245,240,245,{c:'bl',d:.3})+box(240,210,150,70,'Tools',{d:.5}); items.forEach((it,i)=>{ s+=box(it[1],it[2],200,56,it[0],{tc:'dim',d:1+i*.25,fs:16,c:i===7?'rd':''}); s+=arrow(390,245,it[1],it[2]+28,{c:'dim',d:1.1+i*.25}); }); s+=arrow(660,175,700,175,{c:'dim',d:3.2})+arrow(700,200,660,200,{c:'dim',d:3.3})+arrow(800,416,800,220,{c:'dim',d:3.5}); s+=txt(40,420,'None of this is an LLM problem.',{fs:26,bold:true,tc:'ye',d:4.2})+txt(40,458,'It is a state problem.',{fs:26,bold:true,tc:'ye',d:4.6}); return svg(s); }},
 live:{ cycle:6, title:'Where does this live?', v:()=>svg(txt(480,190,'Where does this live?',{fs:52,bold:true,anchor:'middle',d:.2})+['In the prompt?','In a file?','In a cache?','In a database?'].map((s,i)=>box(60+i*220,270,200,66,s,{d:.9+i*.35,c:i===3?'ye':'',fs:19})).join('')+`<rect class="pulse" style="--d:3s" x="716" y="266" width="208" height="74" rx="8" fill="none" stroke="var(--yellow)" stroke-width="2"/>`)},
 doc:{ cycle:9, title:'Our first document', v:()=>svg(box(40,40,520,460,'',{d:.1,anim:'rise'})+lines(64,80,['{','  runId:      "run-1842",','  projectId:  "project-512482",','  status:     "training",','  configuration: { windowMs: 2000,','                   learningRate: 0.001 },','  jobs: [','    { jobId: "job-203", status: "running" }','  ],','  results:    { accuracy: 0.89 },','  approvals: [{ action: "train", by: "human" }],','  createdAt: ..., updatedAt: ...','}'],{mono:true,fs:16,lh:31,d:.3,step:.1})+txt(600,90,'What\u2019s wrong with it?',{fs:28,bold:true,tc:'ye',d:2.2})+lines(600,150,['What grows without bound?','What changes every few seconds?','What needs a history, not a field?','Which query must be fast?','What should not be in here?'],{fs:19,lh:60,d:2.8,step:.8})+`<rect class="pulse" style="--d:3.6s" x="54" y="245" width="420" height="70" rx="6" fill="none" stroke="var(--yellow)" stroke-width="2"/>`+`<rect class="pulse" style="--d:4.4s" x="54" y="150" width="260" height="34" rx="6" fill="none" stroke="var(--blue)" stroke-width="2"/>`)},
 embed:{ cycle:8, title:'Embed, reference, or log', v:()=>svg([['Embed','small · bounded · read together',['configuration snapshot','latest result','current status'],'bl'],['Reference / split','large · unbounded · shared',['job events','training logs','artifacts'],''],['Append-only log','the explanation trail',['actions','status transitions','approvals'],'ye']].map((c,i)=>{ const x=40+i*300; return box(x,50,280,440,'',{c:c[3],d:.2+i*.5})+txt(x+24,100,c[0],{fs:26,bold:true,d:.3+i*.5,tc:c[3]})+txt(x+24,132,c[1],{fs:15,tc:'dim',d:.4+i*.5})+c[2].map((it,j)=>box(x+24,170+j*90,232,64,it,{d:1+i*.5+j*.2,fs:17})).join(''); }).join(''))},
 index:{ cycle:9, title:'The question creates the index', v:()=>svg(txt(40,60,'What the agent asks',{fs:17,tc:'dim',d:.1})+txt(540,60,'The index that answers it',{fs:17,tc:'dim',d:.1})+box(40,80,440,100,'',{d:.3})+lines(60,118,['runs.find({ projectId: "project-512482",','            status: "training" })'],{mono:true,fs:16,d:.5})+arrow(490,130,530,130,{c:'bl',d:1.2})+box(540,100,380,60,'{ projectId: 1, status: 1 }',{mono:true,c:'bl',d:1.6,fs:17})+box(40,220,440,100,'',{d:2.2})+lines(60,258,['runs.find({ projectId: "project-512482" })','    .sort({ updatedAt: -1 }).limit(1)'],{mono:true,fs:16,d:2.4})+arrow(490,270,530,270,{c:'bl',d:3.1})+box(540,240,380,60,'{ projectId: 1, updatedAt: -1 }',{mono:true,c:'bl',d:3.5,fs:17})+txt(40,400,'Equality, then sort, then range.',{fs:24,tc:'ye',bold:true,d:4.4})+[['reads','faster','gn'],['writes','slower','rd'],['storage','larger','rd']].map((t,i)=>txt(540+i*140,400,t[0],{fs:14,tc:'dim',d:5+i*.3})+txt(540+i*140,430,t[1],{fs:22,bold:true,tc:t[2],d:5.1+i*.3})).join(''))},
 polling:{ cycle:8, title:'Polling', v:()=>svg([0,1,2].map(i=>{ const x=70+i*300; return box(x,70,160,60,'agent',{c:'bl',d:.2+i*1.4})+arrow(x+80,130,x+80,180,{d:.6+i*1.4})+box(x,180,160,60,'is it done?',{d:.8+i*1.4})+arrow(x+80,240,x+80,290,{d:1.1+i*1.4})+box(x,290,160,60,'no',{tc:'dim',d:1.3+i*1.4,c:i===2?'rd':''})+txt(x+180,215,i<2?'sleep…':'sleep… ×60',{italic:true,tc:'dim',d:1.5+i*1.4,fs:17})+(i<2?arrow(x+160,320,x+300,100,{c:'dim',d:1.7+i*1.4}):''); }).join('')+txt(480,440,'The agent is doing the database\u2019s job.',{fs:28,bold:true,tc:'ye',anchor:'middle',d:5.2}))},
 doorbell:{ cycle:8, title:'From polling to events', v:()=>svg(box(60,70,260,70,'job updates its state',{d:.2})+arrow(190,140,190,220,{c:'bl',d:.7})+box(60,220,260,70,'change event',{c:'bl',bold:true,d:1.2})+arrow(190,290,190,370,{c:'bl',d:1.7})+box(60,370,260,70,'consumer reacts',{d:2.2})+`<circle class="dot travel" style="--d:2.8s;--t:1.6s;offset-path:path('M190,140 L190,370')" r="8"/>`+`<g class="flash" style="--d:3s"><circle cx="190" cy="255" r="48" fill="none" stroke="var(--yellow)" stroke-width="1.5" opacity=".6"/></g>`+box(400,70,520,290,'',{d:2.6})+lines(424,112,['with runs.watch(pipeline) as cs:','    for change in cs:','        run = change["fullDocument"]','        agent.resume(','            thread_id=run["runId"])'],{mono:true,fs:17,lh:40,d:2.9,step:.2})+txt(400,420,'A doorbell, not a door you keep checking.',{fs:24,tc:'ye',bold:true,d:4.6})+txt(400,460,'Design the failure path: missed events, retries, idempotency, resume.',{fs:15,tc:'dim',d:5}))},
 halflife:{ cycle:9, title:'Memory has a half-life', v:()=>svg([['Keep',['audit history','experiment summaries','approvals'],'bl',false],['Expire',['temporary job state','session context','cache'],'',true],['Review',['raw logs','failed attempts','large prompts'],'dim',false]].map((c,i)=>{ const x=40+i*300; return txt(x,60,c[0],{fs:26,bold:true,tc:c[2],d:.2+i*.3})+c[1].map((it,j)=>`<g class="${c[3]?'fade':''}" style="--d:${4+j*.4}s">${box(x,90+j*80,270,60,it,{c:c[2],d:.6+i*.3+j*.2,fs:17})}</g>`).join(''); }).join('')+box(40,360,600,70,'',{d:2.4})+txt(60,402,'createIndex({ expiresAt: 1 }, { expireAfterSeconds: 0 })',{mono:true,fs:16,d:2.6})+txt(40,490,'A best-before date, stamped when the document is written.',{fs:22,tc:'ye',bold:true,d:5.6}))},
 semantic:{ cycle:8, title:'Not every question is semantic', v:()=>svg(txt(40,60,'Failed jobs for project X, today.',{fs:21,italic:true,d:.2})+box(40,80,430,160,'',{d:.5})+lines(60,118,['runs.find({','  projectId: "project-512482",','  "jobs.status": "failed",','  updatedAt: { $gte: today } })'],{mono:true,fs:15,lh:28,d:.7})+txt(500,60,'Previous failures like this one.',{fs:21,italic:true,d:1.6})+box(500,80,420,160,'',{c:'bl',d:1.9})+lines(520,118,['runs.aggregate([{ $vectorSearch: {','  path: "failureEmbedding",','  queryVector: embed(thisFailure),','  filter: { projectId: ... } }}])'],{mono:true,fs:15,lh:28,d:2.1})+arrow(255,240,255,320,{c:'dim',d:3.2})+arrow(710,240,710,320,{c:'dim',d:3.4})+box(255,320,450,70,'one collection · one document',{c:'ye',d:3.8,fs:20,bold:true,tc:'ye'})+txt(480,470,'Same data. Different question. A query mode, not an architecture.',{fs:21,anchor:'middle',tc:'dim',d:4.8}))},
 guardrails:{ cycle:8, title:'An agent that can act must be explainable', v:()=>svg(['least privilege','confirmation gates','audit trail','rate limits'].map((s,i)=>box(40+i*225,50,205,56,s,{d:.2+i*.3,c:i===2?'ye':'',fs:16})+(i<3?arrow(245+i*225,78,265+i*225,78,{c:'bl',d:.4+i*.3}):'')).join('')+box(40,140,460,280,'',{d:1.6})+lines(60,180,['{ action:      "start_training",','  requestedBy: "agent",','  approvedBy:  "eoin",','  scope:       { projectId: "project-512482" },','  decision:    "approved",','  reason:      "non-destructive training run" }'],{mono:true,fs:15,lh:38,d:1.8,step:.18})+lines(540,200,['If a system can act,','it must be able to explain','how that action was allowed.'],{fs:26,bold:true,tc:'ye',lh:38,d:3.2})+txt(540,340,'Guardrails are data too.',{fs:20,tc:'dim',d:4.2}))},
 resolved:{ cycle:9, title:'The resolved architecture', v:()=>svg(txt(60,60,'What is',{fs:16,tc:'dim',d:.1})+box(60,80,140,52,'LLM',{c:'dim',tc:'dim',d:.2})+arrow(130,132,130,172,{c:'dim',d:.4})+box(60,172,140,52,'tool',{c:'dim',tc:'dim',d:.5})+arrow(130,224,130,264,{c:'dim',d:.7})+box(60,264,140,52,'API',{c:'dim',tc:'dim',d:.8})+txt(300,60,'What could be',{fs:16,tc:'ye',d:1.2})+box(300,190,150,66,'Agent',{c:'bl',bold:true,d:1.4})+arrow(450,223,500,223,{c:'bl',d:1.7})+box(500,190,150,66,'Tools',{bold:true,d:1.9})+arrow(650,223,700,223,{c:'bl',d:2.2})+box(700,70,70,320,'',{c:'ye',d:2.4})+`<g transform="translate(742,230) rotate(-90)"><text class="t ye rise" style="--d:2.6s" font-size="17" font-weight="600" text-anchor="middle">state layer</text></g>`+['structured queries','workflow state','history + audit','semantic retrieval','events'].map((b,i)=>arrow(770,100+i*64,800,100+i*64,{c:'ye',d:2.9+i*.3})+box(800,80+i*64,150,44,b,{d:3+i*.3,fs:14})).join('')+txt(60,470,'The hard part isn\u2019t giving an agent tools. It\u2019s giving it reliable state.',{fs:23,tc:'ye',bold:true,d:4.8}))},
 three:{ cycle:7, title:'Three things', v:()=>svg(['Model for the workload.','Index for the questions.','Treat AI memory as data.'].map((s,i)=>txt(480,180+i*100,s,{fs:44,bold:true,anchor:'middle',tc:i===2?'ye':'',d:.4+i*1.1})).join(''))},
};

const q=new URLSearchParams(location.search), root=document.getElementById('root');
if(q.get('bg')==='transparent') document.body.classList.add('transparent');
const one=q.get('scene');
function mount(el,id){ const s=scenes[id]; el.innerHTML=s.v(); if(q.get('loop')!=='0'){ setInterval(()=>{ el.innerHTML=s.v(); }, s.cycle*1000); } }
if(one && scenes[one]){
  root.innerHTML=`<div class="single"><div class="frame" id="f"></div></div>`; mount(document.getElementById('f'),one);
}else{
  root.innerHTML=`<div class="gallery"><h1>Animation scenes</h1><p>Each scene loops. Open one on its own with <code>?scene=name</code>; add <code>&amp;loop=0</code> to play once, <code>&amp;bg=transparent</code> to key it over your own background. Record at 1920×1080 for a clean 16:9.</p>${Object.keys(scenes).map(k=>`<div class="card"><div class="frame" data-id="${k}"></div><footer><span>${scenes[k].title}</span><a href="?scene=${k}">?scene=${k}</a></footer></div>`).join('')}</div>`;
  document.querySelectorAll('.frame[data-id]').forEach(el=>mount(el,el.dataset.id));
}
</script>
</body>
</html>
